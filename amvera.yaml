# Amvera Cloud manifest — Lovreski (single-container React + FastAPI + MongoDB GridFS)
# Docs: https://docs.amvera.ru/
meta:
  environment: dockerfile
build:
  dockerfile: Dockerfile
run:
  port: 8000
  persistenceMount: /app/data
env:
  # Populate every entry in the Amvera dashboard → Secrets before the first deploy.
  - name: MONGO_URL
    required: true
  - name: DB_NAME
    required: true
  - name: JWT_SECRET
    required: true
  - name: EMERGENT_LLM_KEY
    required: false
  - name: ADMIN_EMAIL
    required: true
  - name: ADMIN_PASSWORD
    required: true
  - name: FRONTEND_URL
    required: false
  - name: CORS_ORIGINS
    required: true
  - name: GOOGLE_CLIENT_ID
    required: false
  - name: GOOGLE_CLIENT_SECRET
    required: false
  - name: SBP_PHONE
    required: true
  - name: SBP_RECIPIENT_NAME
    required: false
  - name: SBP_ENCRYPT_KEY
    required: true
  - name: SBP_WEBHOOK_SECRET
    required: false
