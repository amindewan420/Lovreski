# Amvera Cloud manifest — Lovreski (React + FastAPI + MongoDB GridFS)
# Docs: https://docs.amvera.ru/applications/configuration/docker.html
#
# IMPORTANT: This is NOT a Node.js app. React is only the front-end (built during
# the Docker stage) and the running process is FastAPI (Python) via uvicorn.
# Amvera's `meta.toolchain` section below tells the platform to use our
# Dockerfile — it must NOT try to run `npm start` / `node scripts/start.js`.

meta:
  environment: docker
  toolchain:
    name: docker
    version: latest

build:
  dockerfile: Dockerfile
  skip: false

run:
  persistenceMount: /app/data
  containerPort: "8000"

# Every entry below must be filled in the Amvera dashboard → Secrets before deploy.
env:
  - name: MONGO_URL
    required: true
  - name: DB_NAME
    required: true
  - name: JWT_SECRET
    required: true
  - name: EMERGENT_LLM_KEY
    required: false
  - name: ADMIN_EMAIL
    required: true
  - name: ADMIN_PASSWORD
    required: true
  - name: FRONTEND_URL
    required: false
  - name: CORS_ORIGINS
    required: true
  - name: GOOGLE_CLIENT_ID
    required: false
  - name: GOOGLE_CLIENT_SECRET
    required: false
  - name: SBP_PHONE
    required: true
  - name: SBP_RECIPIENT_NAME
    required: false
  - name: SBP_ENCRYPT_KEY
    required: true
  - name: SBP_WEBHOOK_SECRET
    required: false
