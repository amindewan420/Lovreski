<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#D91656" />
    <meta name="description" content="Lovreski — знакомства нового поколения" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;800;900&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Lovreski — Знакомства</title>
    <script>
      window.addEventListener("error", function (e) {
        if (
          e.error instanceof DOMException &&
          e.error.name === "DataCloneError" &&
          e.message &&
          e.message.includes("PerformanceServerTiming")
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
    <script src="https://assets.emergent.sh/scripts/emergent-main.js"></script>
  </head>
  <body>
    <noscript>Требуется включить JavaScript для запуска приложения.</noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
