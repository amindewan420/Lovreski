# Optional nginx reverse-proxy — for split-service deploys where a dedicated
# nginx container fronts an internal backend. In the single-container
# Amvera deploy this file is unused; FastAPI serves the SPA and /api directly.

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 25m;

    # Prod SPA
    root /usr/share/nginx/html;
    index index.html;

    # WebSocket upgrade
    location /api/ws {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
    }

    # REST + file streaming
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # Health probe (backend)
    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # Everything else = SPA (client-side routing)
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
